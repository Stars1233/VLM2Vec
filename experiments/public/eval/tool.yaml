# ToolDe 评估配置
# 文本到文本的工具文档检索任务
# 
# 数据结构说明：
# - Query分为三大类：web, code, customized，每个大类下有多个子任务
#   例如：web/apigen, code/xxx, customized/xxx
# - Candidate也分为三大类：web, code, customized
# - 评估时按类别检索：web的query只在web的candidate中检索

