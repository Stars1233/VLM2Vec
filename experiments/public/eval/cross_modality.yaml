# OmniSET cross-modality evaluation tasks. Paths are resolved relative to DATA_BASEDIR.

OmniSET_t2i:
    dataset_parser: omniset
    dataset_name: OmniSET_cmt2i
    dataset_split: test
    data_path: omniset.jsonl
    image_root: val2014
    video_root: videos
    audio_root: audios
    frame_root: frames_omni
    num_frames: 8
    max_frames_saved: 16
    input_mod: ['T']
    query_mod: ['I']
    cand_mod: ['T', 'I', 'V', 'A']
    eval_type: local

